name: AI CI triage
description: Explain Playwright failures in one PR comment without changing the test gate.
inputs:
  report:
    description: Path to the Playwright JSON report.
    required: true
  verdicts:
    description: Path to failure-classifier JSON verdicts.
    required: true
  github-token:
    description: Token with pull-requests write permission for the current repository.
    default: ${{ github.token }}
  groq-api-key:
    description: Groq API key. Required for a real diagnosis.
  groq-model:
    description: Groq model supporting strict structured output.
    default: openai/gpt-oss-120b
  max-input-tokens:
    description: Input context budget. Groq counts are local estimates.
    default: '30000'
  dry-run:
    description: Build the prompt without diagnosis or comment. PR context may still contact GitHub.
    default: 'false'
outputs:
  result:
    description: Path to the diagnosis JSON file, when a run produces one.
runs:
  using: node24
  main: dist/index.mjs
